[package]
name = "rusty-lambda-extension"
version = "0.1.0"
edition = "2021"
authors = ["Luis Carlos Osorio Jayk <https://github.com/luiscarlosjayk/>"]

[dependencies]
aws-config = { version = "1.5.7", features = ["behavior-version-latest"] }
lambda-extension = "0.11.0"
serde = "1.0.218"
serde_json = "1.0.139"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
axum = "0.8.1"
